name: Telegram-бот

on:
  schedule:
    # каждые 15 минут
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Обработать команды
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python bot.py
      - name: Отметить опубликованное
        run: |
          git config user.name "smm-bot"
          git config user.email "smm-bot@users.noreply.github.com"
          git add posts/*/published.txt tg_chat_id.txt 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Опубликован пост (команда из Telegram)"
          git pull --rebase -q && git push
