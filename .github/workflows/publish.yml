name: Публикация в Instagram

on:
  schedule:
    # 05:00 UTC = 10:00 по Астане, понедельник, среда, пятница
    - cron: "0 5 * * 1,3,5"
  workflow_dispatch:
    inputs:
      mode:
        description: "check — проверить подключение; дата ГГГГ-ММ-ДД — опубликовать пост за эту дату; пусто — пост на сегодня"
        required: false
        default: "check"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Опубликовать
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python publish.py ${{ github.event.inputs.mode }}
      - name: Отметить опубликованное
        run: |
          git config user.name "smm-bot"
          git config user.email "smm-bot@users.noreply.github.com"
          git add posts/*/published.txt 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Опубликован пост" && git push)
